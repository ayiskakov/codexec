[package]
name = "codexec-server"
description = "HTTP API, SQLite-backed submission queue and judge workers in one process"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "codexec_server"
path = "src/lib.rs"

[[bin]]
name = "codexec-server"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
codexec-judge = { path = "../judge" }
futures-util.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
codexec-judge = { path = "../judge", features = ["mock"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
